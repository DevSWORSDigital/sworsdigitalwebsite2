<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#081329" />
    <meta
      name="description"
      content="Modelo demonstrativo Barbearia Prime — estrutura personalizável SWORS Digital."
    />
    <title>Barbearia Prime — Modelo demonstrativo | SWORS Digital</title>
    <style>
      /* SWORS Digital — demos independentes, responsivas e sem frameworks. */
      :root {
        font-family: Inter, "Segoe UI", Arial, sans-serif;
        font-synthesis: none;
        color: #142038;
        background: #f5f6f9;
        --hero-bg: #0f1b33;
        --hero-ink: #fff;
        --accent: #c9ae7f;
        --accent-text: #151c2a;
        --hero-muted: rgba(255, 255, 255, 0.7);
        --art-color: #eed9b5;
        --panel: #f7f7f7;
        --panel-ink: #111d32;
        --cta-bg: #121e33;
        --cta-ink: #fff;
        --border: #dce1e8;
        --footer-bg: #0f1728;
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html {
        scroll-behavior: smooth;
        scroll-padding-top: 70px;
      }
      body {
        margin: 0;
        min-width: 320px;
        background: #fff;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      button {
        font: inherit;
        cursor: pointer;
      }
      a:focus-visible,
      button:focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: 4px;
      }
      svg {
        display: block;
      }
      .shell {
        width: min(1180px, calc(100% - 80px));
        margin-inline: auto;
      }
      .demo-ribbon {
        color: #bac7df;
        background: #071326;
        letter-spacing: 0.16em;
        text-align: center;
        font-size: 9px;
        line-height: 1.6;
        padding: 9px 14px;
        font-weight: 650;
      }
      .demo-ribbon span {
        color: #5a79aa;
        padding: 0 8px;
      }
      .site-head {
        position: absolute;
        z-index: 20;
        left: 0;
        right: 0;
        background: transparent;
      }
      .head-row {
        height: 93px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 30px;
      }
      .brand {
        color: var(--hero-ink);
        font-size: 24px;
        letter-spacing: -0.08em;
        font-weight: 850;
        line-height: 1;
        white-space: nowrap;
        display: inline-flex;
        align-items: end;
        gap: 9px;
      }
      .brand-rule {
        width: 30px;
        height: 5px;
        background: var(--accent);
        border-radius: 5px;
        margin-bottom: 1px;
      }
      .site-nav {
        display: flex;
        gap: 34px;
        align-items: center;
      }
      .site-nav a {
        color: var(--hero-ink);
        font-size: 12px;
        font-weight: 600;
        opacity: 0.78;
        transition: opacity 0.2s;
      }
      .site-nav a:hover {
        opacity: 1;
      }
      .head-cta {
        display: flex;
        align-items: center;
        gap: 10px;
        border: 1px solid color-mix(in srgb, var(--hero-ink) 24%, transparent);
        padding: 14px 17px;
        color: var(--hero-ink);
        font-weight: 700;
        font-size: 12px;
        border-radius: 7px;
        white-space: nowrap;
      }
      .head-cta svg {
        width: 16px;
      }
      .menu-toggle {
        display: none;
      }
      .hero {
        position: relative;
        background: var(--hero-bg);
        color: var(--hero-ink);
        overflow: hidden;
        padding: 156px 0 27px;
        isolation: isolate;
      }
      .hero:before {
        content: "";
        position: absolute;
        inset: 0;
        background:
          radial-gradient(
            ellipse at 86% 8%,
            color-mix(in srgb, var(--accent) 11%, transparent),
            transparent 52%
          ),
          radial-gradient(
            circle at 22% 90%,
            color-mix(in srgb, var(--accent) 8%, transparent),
            transparent 60%
          );
        z-index: -1;
      }
      .hero-grid {
        display: grid;
        grid-template-columns: 50% 50%;
        gap: 18px;
        min-height: 480px;
        align-items: center;
      }
      .hero-copy {
        padding: 0 0 40px;
        position: relative;
        z-index: 2;
      }
      .eyebrow {
        font-size: 10px;
        line-height: 1.6;
        font-weight: 750;
        letter-spacing: 0.18em;
        color: var(--accent);
        display: inline-flex;
        align-items: center;
        gap: 10px;
        text-transform: uppercase;
      }
      .eyebrow i {
        width: 7px;
        height: 7px;
        border-radius: 100%;
        background: var(--accent);
        box-shadow: 0 0 0 5px color-mix(in srgb, var(--accent) 13%, transparent);
      }
      .hero h1 {
        font-size: clamp(46px, 5.65vw, 86px);
        font-weight: 790;
        letter-spacing: -0.065em;
        line-height: 1.04;
        max-width: 670px;
        margin: 25px 0 22px;
        text-wrap: balance;
      }
      .lead {
        max-width: 490px;
        font-size: 15px;
        line-height: 1.85;
        color: var(--hero-muted);
      }
      .hero-actions {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 14px;
        margin-top: 30px;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 18px;
        font-weight: 750;
        font-size: 12px;
        padding: 17px 23px;
        border-radius: 7px;
        min-height: 50px;
        transition:
          transform 0.22s ease,
          box-shadow 0.22s ease,
          background 0.22s ease;
      }
      .btn svg {
        flex: 0 0 auto;
      }
      .btn:hover {
        transform: translateY(-3px);
      }
      .btn-primary {
        background: var(--accent);
        color: var(--accent-text);
        box-shadow: 0 12px 25px
          color-mix(in srgb, var(--accent) 16%, transparent);
      }
      .btn-secondary {
        border: 1px solid color-mix(in srgb, var(--hero-ink) 32%, transparent);
        color: var(--hero-ink);
      }
      .hero-micro {
        margin-top: 48px;
        display: flex;
        gap: 15px;
        align-items: center;
        color: var(--hero-muted);
        letter-spacing: 0.15em;
        font-size: 9px;
        font-weight: 750;
      }
      .micro-line {
        width: 34px;
        height: 1px;
        background: var(--accent);
      }
      .hero-visual {
        position: relative;
        width: 100%;
        height: 520px;
        display: grid;
        place-items: center;
        perspective: 750px;
      }
      .visual-grid {
        position: absolute;
        inset: 4% 0 6% 5%;
        background:
          linear-gradient(
            transparent 97%,
            color-mix(in srgb, var(--art-color) 14%, transparent) 97%
          ),
          linear-gradient(
            90deg,
            transparent 97%,
            color-mix(in srgb, var(--art-color) 13%, transparent) 97%
          );
        background-size: 65px 65px;
        opacity: 0.45;
        mask-image: radial-gradient(circle, #000, transparent 75%);
      }
      .visual-halo {
        position: absolute;
        width: 390px;
        height: 390px;
        max-width: 88%;
        background: radial-gradient(
          circle,
          color-mix(in srgb, var(--accent) 22%, transparent) 0%,
          transparent 65%
        );
        filter: blur(8px);
      }
      .visual-orbit {
        pointer-events: none;
        border: 1px solid color-mix(in srgb, var(--art-color) 20%, transparent);
        width: 470px;
        height: 470px;
        max-width: 92%;
        position: absolute;
        border-radius: 50%;
        transform: rotate(-18deg) scaleX(0.82);
      }
      .visual-card {
        border: 1px solid color-mix(in srgb, var(--art-color) 35%, transparent);
        box-shadow:
          0 35px 70px #0005,
          inset 0 1px #ffffff20;
      }
      .visual-card-main {
        width: min(450px, 85%);
        min-height: 390px;
        padding: 20px;
        position: relative;
        border-radius: 35px;
        color: var(--art-color);
        background: linear-gradient(
          135deg,
          color-mix(in srgb, var(--accent) 23%, var(--hero-bg)),
          color-mix(in srgb, var(--hero-bg) 95%, #000)
        );
        transform: rotate(-5deg) translateY(-5px);
        overflow: hidden;
      }
      .visual-card-main::before {
        content: "";
        position: absolute;
        width: 220px;
        height: 220px;
        right: -80px;
        top: -50px;
        border: 1px solid currentColor;
        opacity: 0.3;
        border-radius: 50%;
      }
      .art-surface {
        position: relative;
        display: grid;
        place-items: center;
        height: 345px;
      }
      .hero-symbol {
        width: min(290px, 78%);
        max-height: 300px;
        filter: drop-shadow(0 20px 18px #0003);
      }
      .visual-overline {
        position: absolute;
        left: 28px;
        bottom: 25px;
        letter-spacing: 0.14em;
        font-size: 9px;
        font-weight: 750;
        opacity: 0.7;
      }
      .visual-card-small {
        position: absolute;
        right: -5px;
        bottom: 40px;
        width: 228px;
        z-index: 2;
        padding: 18px 19px;
        border-radius: 12px;
        background: var(--accent);
        color: var(--accent-text);
        display: flex;
        flex-direction: column;
        gap: 6px;
        font-size: 9px;
        font-weight: 800;
        letter-spacing: 0.12em;
        transform: rotate(5deg);
      }
      .visual-card-small b {
        font-size: 24px;
        letter-spacing: -0.05em;
        font-weight: 850;
      }
      .visual-small-dot {
        width: 7px;
        height: 7px;
        background: currentColor;
        border-radius: 50%;
      }
      .hero-bottom {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.1em;
        padding-top: 28px;
        border-top: 1px solid
          color-mix(in srgb, var(--hero-ink) 19%, transparent);
        color: var(--hero-muted);
      }
      .hero-bottom a {
        white-space: nowrap;
        color: var(--hero-ink);
      }
      .hero-bottom a span {
        font-size: 17px;
        margin-left: 10px;
      }
      .section-block {
        padding: 105px 0;
      }
      .services {
        background: var(--panel);
        color: var(--panel-ink);
      }
      .section-intro {
        display: flex;
        justify-content: space-between;
        gap: 50px;
        align-items: end;
        margin-bottom: 42px;
      }
      .eyebrow-dark {
        color: var(--accent);
      }
      .section-intro h2,
      .about h2,
      .cta-panel h2 {
        font-size: clamp(36px, 4vw, 58px);
        line-height: 1.13;
        letter-spacing: -0.06em;
        font-weight: 770;
        margin: 13px 0 0;
        max-width: 610px;
        text-wrap: balance;
      }
      .section-intro > p {
        color: #68738a;
        font-size: 15px;
        line-height: 1.85;
        max-width: 355px;
        margin: 0 0 5px;
      }
      .service-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 16px;
      }
      .service-card {
        min-height: 285px;
        background: #fff;
        padding: 29px;
        border: 1px solid var(--border);
        border-radius: 14px;
        display: flex;
        flex-direction: column;
        transition:
          transform 0.2s,
          border-color 0.2s,
          box-shadow 0.2s;
      }
      .service-card:hover {
        transform: translateY(-6px);
        border-color: var(--accent);
        box-shadow: 0 25px 50px #182b4613;
      }
      .service-number {
        color: #8290a4;
        font-size: 10px;
        letter-spacing: 0.13em;
        font-weight: 750;
      }
      .service-icon {
        margin: 32px 0 8px;
        width: 44px;
        height: 44px;
        display: grid;
        place-items: center;
        color: var(--accent);
        background: color-mix(in srgb, var(--accent) 10%, white);
        border-radius: 12px;
      }
      .service-card h3 {
        font-size: 23px;
        letter-spacing: -0.045em;
        margin: 8px 0;
      }
      .service-card p {
        font-size: 13px;
        line-height: 1.8;
        color: #6e7a8e;
        margin: 0 0 20px;
        flex: 1;
      }
      .service-card a {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-size: 11px;
        font-weight: 800;
        color: #21344e;
      }
      .service-card a svg {
        width: 15px;
      }
      .about {
        background: #fff;
      }
      .about-grid {
        display: grid;
        grid-template-columns: 0.94fr 1.06fr;
        align-items: center;
        gap: 9%;
      }
      .about-art {
        position: relative;
        min-height: 410px;
        display: grid;
        place-items: center;
        background: linear-gradient(
          145deg,
          color-mix(in srgb, var(--accent) 15%, white),
          color-mix(in srgb, var(--accent) 4%, white)
        );
        border-radius: 20px;
        overflow: hidden;
      }
      .about-art > span {
        position: absolute;
        top: 25px;
        left: 30px;
        font-weight: 750;
        letter-spacing: 0.2em;
        font-size: 10px;
        color: #34475d;
      }
      .about-shape {
        width: 90%;
        color: var(--accent);
        filter: drop-shadow(0 14px 24px #0002);
        transform: rotate(-10deg);
      }
      .about-shape .hero-symbol {
        width: 100%;
        max-height: 340px;
      }
      .about-content h2 {
        margin-top: 20px;
        max-width: 550px;
      }
      .about-content > p {
        font-size: 15px;
        line-height: 1.9;
        color: #6d788c;
        max-width: 530px;
        margin: 20px 0;
      }
      .about-list {
        padding: 0;
        margin: 29px 0;
        list-style: none;
        display: grid;
        gap: 13px;
      }
      .about-list li {
        display: flex;
        gap: 10px;
        align-items: center;
        font-weight: 600;
        color: #3a4b63;
        font-size: 13px;
      }
      .about-list svg {
        color: var(--accent);
      }
      .text-link {
        display: inline-flex;
        align-items: center;
        gap: 13px;
        font-size: 13px;
        font-weight: 750;
        border-bottom: 1px solid #b7c2d0;
        padding: 12px 0;
      }
      .cta-section {
        background: #fff;
        padding: 40px 0 110px;
      }
      .cta-panel {
        background: var(--cta-bg);
        color: var(--cta-ink);
        border-radius: 20px;
        padding: 65px 72px;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 40px;
      }
      .cta-panel > div:first-child {
        z-index: 1;
        max-width: 690px;
      }
      .cta-panel h2 {
        max-width: 650px;
      }
      .cta-panel p {
        max-width: 570px;
        line-height: 1.8;
        font-size: 14px;
        opacity: 0.7;
        margin: 23px 0 27px;
      }
      .btn-cta {
        background: var(--accent);
        color: var(--accent-text);
      }
      .cta-art {
        color: var(--accent);
        opacity: 0.24;
        width: 260px;
        flex: 0 0 260px;
        transform: rotate(10deg) scale(1.2);
      }
      .cta-art .hero-symbol {
        width: 100%;
      }
      .footer {
        background: var(--footer-bg);
        color: #d5dff0;
        padding: 37px 0;
      }
      .footer-inner {
        display: flex;
        gap: 20px;
        justify-content: space-between;
        align-items: center;
      }
      .footer b {
        font-size: 20px;
        letter-spacing: -0.06em;
      }
      .footer span {
        font-size: 10px;
        opacity: 0.56;
        letter-spacing: 0.07em;
      }
      .footer a {
        font-size: 11px;
        font-weight: 700;
      }
      /* Oito direções visuais derivadas dos segmentos dos modelos recebidos. */
      body[data-model="advocacia"] {
        --hero-bg: #131925;
        --hero-ink: #fff9ec;
        --accent: #d7b77b;
        --accent-text: #182033;
        --art-color: #e1ccac;
        --panel: #faf7f0;
        --panel-ink: #27252b;
        --cta-bg: #171d2b;
        --border: #e9e2d6;
      }
      body[data-model="advocacia"] h1,
      body[data-model="casamento"] h1 {
        font-family: Georgia, "Times New Roman", serif;
        font-weight: 500;
        letter-spacing: -0.052em;
      }
      body[data-model="assistencia-medica"] {
        --hero-bg: #e7f4ff;
        --hero-ink: #12345b;
        --hero-muted: #58708e;
        --accent: #2876e8;
        --accent-text: #fff;
        --art-color: #357ec5;
        --panel: #f0f7fd;
        --panel-ink: #183a62;
        --cta-bg: #123b68;
        --border: #d9e8f4;
      }
      body[data-model="assistencia-medica"] .site-head {
        background: rgba(255, 255, 255, 0.26);
      }
      body[data-model="assistencia-medica"] .visual-card-main {
        background: linear-gradient(150deg, #fff, #d6edff);
        box-shadow: 0 35px 60px #215a922a;
      }
      body[data-model="assistencia-medica"] .hero h1 {
        font-weight: 770;
      }
      body[data-model="barbearia"] {
        --hero-bg: #15171c;
        --hero-ink: #fff;
        --hero-muted: #d4c9c3;
        --accent: #f39c6b;
        --accent-text: #251514;
        --art-color: #e2b58f;
        --panel: #f5f0e9;
        --panel-ink: #241b19;
        --cta-bg: #1a1617;
        --border: #eadfd5;
      }
      body[data-model="barbearia"] .hero:before {
        background:
          repeating-linear-gradient(
            -50deg,
            transparent,
            transparent 76px,
            #ffffff07 78px,
            transparent 81px
          ),
          radial-gradient(circle at 70% 40%, #73433448, transparent 60%);
      }
      body[data-model="wedding"],
      body[data-model="casamento"] {
        --hero-bg: #fcf3ef;
        --hero-ink: #694452;
        --hero-muted: #936f7f;
        --accent: #c47e92;
        --accent-text: #fff;
        --art-color: #c47e92;
        --panel: #fff9f7;
        --panel-ink: #684958;
        --cta-bg: #754e62;
        --border: #f0dce2;
      }
      body[data-model="casamento"] .hero h1 {
        font-size: clamp(46px, 5vw, 77px);
      }
      body[data-model="casamento"] .visual-card-main {
        background: linear-gradient(140deg, #fffaf7, #f1dfe6);
        box-shadow: 0 25px 70px #8d5d7926;
      }
      body[data-model="ciberseguranca"] {
        --hero-bg: #031f27;
        --hero-ink: #e8fdff;
        --hero-muted: #a9c8d0;
        --accent: #52e1b8;
        --accent-text: #042923;
        --art-color: #56dcc8;
        --panel: #f0f8f7;
        --panel-ink: #12373c;
        --cta-bg: #06353d;
        --border: #cee5e5;
      }
      body[data-model="ciberseguranca"] .hero:before {
        background:
          repeating-linear-gradient(
            90deg,
            #ffffff06 0 1px,
            transparent 1px 70px
          ),
          radial-gradient(circle at 70% 50%, #12a89d34, transparent 60%);
      }
      body[data-model="comida"] {
        --hero-bg: #341a17;
        --hero-ink: #fff6ed;
        --hero-muted: #f1c7b3;
        --accent: #ff965d;
        --accent-text: #3d1d15;
        --art-color: #ffc08b;
        --panel: #fff8ef;
        --panel-ink: #3b2b24;
        --cta-bg: #59271e;
        --border: #f1e2d4;
      }
      body[data-model="comida"] .hero h1 {
        font-weight: 900;
        text-transform: uppercase;
        font-size: clamp(43px, 5.7vw, 84px);
      }
      body[data-model="comida"] .visual-card-main {
        border-radius: 28% 22% 22% 24%;
      }
      body[data-model="construcao"] {
        --hero-bg: #122b4a;
        --hero-ink: #f5faff;
        --hero-muted: #cad9e7;
        --accent: #ff8b39;
        --accent-text: #1d2d3d;
        --art-color: #ffa76c;
        --panel: #f4f7fb;
        --panel-ink: #193451;
        --cta-bg: #143559;
        --border: #d9e2ed;
      }
      body[data-model="construcao"] .visual-grid {
        opacity: 0.9;
      }
      body[data-model="consultoria-fitness"] {
        --hero-bg: #141715;
        --hero-ink: #f6fcf2;
        --hero-muted: #c9d4c5;
        --accent: #bcf14b;
        --accent-text: #1e3013;
        --art-color: #cef77d;
        --panel: #f5f8ef;
        --panel-ink: #1f3221;
        --cta-bg: #1e2e20;
        --border: #dfe7d7;
      }
      body[data-model="consultoria-fitness"] .hero h1 {
        font-weight: 920;
        text-transform: uppercase;
        font-size: clamp(44px, 6vw, 88px);
      }
      body[data-model="consultoria-fitness"] .visual-card-main {
        transform: rotate(6deg) translateY(-5px);
      }
      @media (max-width: 950px) {
        .shell {
          width: min(100% - 46px, 1180px);
        }
        .hero-grid {
          grid-template-columns: 1.1fr 0.9fr;
          min-height: 440px;
        }
        .hero h1 {
          font-size: clamp(43px, 5.8vw, 70px);
        }
        .hero-visual {
          height: 430px;
        }

            <div class="visual-orbit"></div>
          </div>
        </div>
        <div class="hero-bottom shell"><span>${data.tag}</span><a href="#servicos">DESLIZE PARA EXPLORAR <span aria-hidden="true">↓</span></a></div>
      </section>
      <section class="services section-block" id="servicos" aria-labelledby="services-title">
        <div class="shell">
          <div class="section-intro"><div><span class="eyebrow eyebrow-dark">01 / POSSIBILIDADES</span><h2 id="services-title">${data.sectionTitle}</h2></div><p>${data.sectionLead}</p></div>
          <div class="service-grid">${data.services.map(serviceCard).join("")}</div>
        </div>
      </section>
      <section class="about section-block" id="sobre" aria-labelledby="about-title"><div class="shell about-grid">
        <div class="about-art"><span>SW / 08</span><div class="about-shape">${art}</div></div>
        <div class="about-content"><span class="eyebrow">02 / NOSSO OLHAR</span><h2 id="about-title">${data.methodTitle}</h2><p>${data.methodDesc}</p><ul class="about-list"><li>${iconCheck()} Experiência adaptada a diferentes telas</li><li>${iconCheck()} Conteúdo e identidade personalizáveis</li><li>${iconCheck()} Estrutura clara e navegação objetiva</li></ul><a href="#contato" class="text-link">Conheça a proposta ${iconArrow()}</a></div>
      </div></section>
      <section class="cta-section" id="contato"><div class="shell cta-panel"><div><span class="eyebrow">03 / PRÓXIMOS PASSOS</span><h2>${data.promise}</h2><p>Gostou do estilo? Esta estrutura pode ser adaptada à sua marca. Solicite informações sobre escopo, prazo e investimento diretamente à SWORS Digital.</p><a class="btn btn-cta" href="${contact}" target="_blank" rel="noopener noreferrer">${data.ctaEnd} ${iconArrow()}</a></div><div class="cta-art" aria-hidden="true">${art}</div></div></section>
    </main>
    <footer class="footer"><div class="shell footer-inner"><b>${data.mark}</b><span>ESTRUTURA DEMONSTRATIVA • SEM SERVIÇOS REAIS OU ENVIO DE DADOS</span><a href="${contact}" target="_blank" rel="noopener noreferrer">PERSONALIZAR COM A SWORS ↗</a></div></footer>
  `;
      }

      const active = CATALOG.find(
        (item) => item.slug === document.body.dataset.model,
      );
      const target = document.getElementById("app");
      if (active && target) {
        target.innerHTML = buildPage(active);
        document.title = `${active.name} — Modelo demonstrativo | SWORS Digital`;
        const toggle = document.querySelector(".menu-toggle");
        const nav = document.querySelector("#demo-nav");
        toggle?.addEventListener("click", () => {
          const open = toggle.getAttribute("aria-expanded") !== "true";
          toggle.setAttribute("aria-expanded", String(open));
          toggle.setAttribute(
            "aria-label",
            open ? "Fechar menu" : "Abrir menu",
          );
          nav?.classList.toggle("open", open);
        });
        nav?.querySelectorAll("a").forEach((link) =>
          link.addEventListener("click", () => {
            nav.classList.remove("open");
            toggle?.setAttribute("aria-expanded", "false");
            toggle?.setAttribute("aria-label", "Abrir menu");
          }),
        );
      } else if (target) {
        target.innerHTML = "<p>Modelo não encontrado.</p>";
      }
    </script>
  </body>
</html>
